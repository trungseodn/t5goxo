server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy API requests to backend NestJS (^~ stops regex matching)
    location ^~ /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
    }

    # Proxy Static Storage (images, videos, fonts) to backend NestJS (^~ stops regex matching)
    location ^~ /storage/ {
        proxy_pass http://api:3000/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy legacy /images/ and /templates/ (^~ stops regex matching)
    location ^~ /images/ {
        proxy_pass http://api:3000/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /templates/ {
        proxy_pass http://api:3000/templates/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache immutable hashed frontend assets ONLY under /assets/
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve React SPA router fallback (never cache index.html so updates are instant)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
